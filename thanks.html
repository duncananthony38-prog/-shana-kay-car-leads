<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thanks | {{ dealership_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="shell narrow">
    <section class="card thanks">
      <div class="check">✓</div>
      <h1>Your request was sent.</h1>
      <p>Shana-Kay Gardener can follow up using the contact information you submitted.</p>
      {% if lead_id %}
      <p class="leadid">Lead ID: <strong>{{ lead_id }}</strong></p>
      {% endif %}
      <div class="actions center">
        <a class="button secondary" href="sms:{{ agent_phone }}">Text Shana-Kay</a>
        <a class="button secondary" href="mailto:{{ agent_email }}">Email Shana-Kay</a>
        <a class="button primary" href="{{ dealership_url }}" target="_blank" rel="noopener">Browse Vehicles</a>
      </div>
    </section>
  </main>
</body>
</html>
